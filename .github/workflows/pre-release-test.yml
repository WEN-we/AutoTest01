name: Web 端发布前验证 CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨执行

# 配置权限
permissions:
  contents: write
  pages: write
  id-token: write

# 环境变量
env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 质量平台 / AI 工具链单元测试 + 覆盖率门禁（最快反馈，失败即阻断）
  platform-unit-tests:
    name: 平台单元测试与覆盖率门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 运行平台单元测试 + 覆盖率门禁（低于 70% 阻断）
        run: |
          set +e
          pytest tests/test_platform/ -q \
            --cov=quality_platform --cov=utils/ai \
            --cov-report=term --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            --junitxml=reports/platform/junit-unit.xml > pytest_out.txt 2>&1
          ec=$?
          echo "## 平台单元测试退出码: $ec" >> $GITHUB_STEP_SUMMARY
          grep -E "FAILED|ERROR|TOTAL|Required test coverage|[0-9]+ passed|[0-9]+ failed" pytest_out.txt | tail -25 >> $GITHUB_STEP_SUMMARY || true
          # 关键行写入 annotations（check-runs API 可读，便于远程定位失败）
          grep -E "FAILED|ERROR|TOTAL|Required test coverage|passed|failed" pytest_out.txt | tail -25 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $ec

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-coverage
          path: coverage.xml

      - name: 上传单元测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/platform/junit-unit.xml

  # Web 端 UI 测试
  web-tests:
    name: Web 端 UI 测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_pwd
          MYSQL_DATABASE: test_auto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 设置 Node.js 版本
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          playwright install chromium

      - name: 等待 MySQL 启动
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1" 2>/dev/null; then
              echo "MySQL 服务已启动"
              break
            fi
            sleep 2
          done
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_pwd

      - name: 初始化测试数据库
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -D test_auto <<'EOF'
          CREATE TABLE IF NOT EXISTS user (
            id INT AUTO_INCREMENT PRIMARY KEY,
            username VARCHAR(50) NOT NULL,
            password VARCHAR(100) NOT NULL
          );
          EOF
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_pwd

      - name: 初始化数据库（建库建表）
        run: |
          python local_web_login/init_database.py
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci_test_only_pwd
          LOCAL_DB_NAME: local_web_login
          LOCAL_DB_HOST: 127.0.0.1
          LOCAL_DB_PORT: 3306
          LOCAL_DB_USER: root
          LOCAL_DB_PASSWORD: ci_test_only_pwd
          # 与 test_data/ui/ui_test_data.yaml 正确登录用例一致（admin/123456）；
          # admin 在此步骤创建，缺此变量会用默认密码致 UI「正确登录」用例失败
          ADMIN_DEFAULT_PASSWORD: "123456"

      - name: 启动本地登录服务
        run: |
          nohup python local_web_login/backend_server.py > login_server.log 2>&1 &
          sleep 8
          curl -s http://127.0.0.1:8090/ || echo "服务启动失败，继续执行测试"
        env:
          LOCAL_DB_HOST: 127.0.0.1
          LOCAL_DB_PORT: 3306
          LOCAL_DB_USER: root
          LOCAL_DB_PASSWORD: ci_test_only_pwd
          # 与 test_data/ui/ui_test_data.yaml 的「正确用户名密码登录」一致（admin/123456）
          ADMIN_DEFAULT_PASSWORD: "123456"

      - name: 运行 Web 端 UI 测试
        run: |
          set +e
          pytest tests/test_ui/ -v --alluredir=allure-results-ui --junitxml=reports/platform/junit-ui.xml > ui_pytest.txt 2>&1
          ec=$?
          grep -E "FAILED|ERROR|passed|failed|Timeout|Error" ui_pytest.txt | tail -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $ec
        continue-on-error: true
        env:
          HEADLESS: true

      - name: 质量门禁检查（UI，失败阻止发布）
        run: |
          set +e
          python quality_platform/scripts/gate_check.py \
            --junit-xml reports/platform/junit-ui.xml \
            --min-pass-rate 80 --max-fail 5 > gate_out.txt 2>&1
          ec=$?
          echo "## UI 门禁退出码: $ec" >> $GITHUB_STEP_SUMMARY
          tail -20 gate_out.txt >> $GITHUB_STEP_SUMMARY
          tail -20 gate_out.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $ec

      - name: 上传 UI 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: allure-results-ui

      - name: 上传 UI 测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: |
            logs/
            login_server.log

  # Web 端 API 测试
  api-tests:
    name: Web 端 API 测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_pwd
          MYSQL_DATABASE: test_auto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 等待 MySQL 启动
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1" 2>/dev/null; then
              echo "MySQL 服务已启动"
              break
            fi
            sleep 2
          done
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_pwd

      - name: 初始化数据库（建库建表）
        run: |
          python local_web_login/init_database.py
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci_test_only_pwd
          LOCAL_DB_NAME: local_web_login
          LOCAL_DB_HOST: 127.0.0.1
          LOCAL_DB_PORT: 3306
          LOCAL_DB_USER: root
          LOCAL_DB_PASSWORD: ci_test_only_pwd
          # 与 test_data/ui/ui_test_data.yaml 正确登录用例一致（admin/123456）；
          # admin 在此步骤创建，缺此变量会用默认密码致 UI「正确登录」用例失败
          ADMIN_DEFAULT_PASSWORD: "123456"

      - name: 启动本地登录服务
        run: |
          nohup python local_web_login/backend_server.py > login_server.log 2>&1 &
          sleep 8
          curl -s http://127.0.0.1:8090/ || echo "服务启动失败，继续执行测试"
        env:
          LOCAL_DB_HOST: 127.0.0.1
          LOCAL_DB_PORT: 3306
          LOCAL_DB_USER: root
          LOCAL_DB_PASSWORD: ci_test_only_pwd
          # 与 test_data/ui/ui_test_data.yaml 的「正确用户名密码登录」一致（admin/123456）
          ADMIN_DEFAULT_PASSWORD: "123456"

      - name: 运行 API 测试
        run: |
          set +e
          pytest tests/test_api/ -v --alluredir=allure-results-api --junitxml=reports/platform/junit-api.xml > api_pytest.txt 2>&1
          ec=$?
          grep -E "FAILED|ERROR|passed|failed|Timeout|Error" api_pytest.txt | tail -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $ec
        continue-on-error: true
        env:
          # 注意：TEST_API_URL 必须为根地址（不含 /api），测试数据 url 会拼接路径；
          # 若带 /api 会拼成 /api/api/login -> 404
          TEST_API_URL: http://127.0.0.1:8090
          TEST_UI_URL: http://127.0.0.1:8090

      - name: 质量门禁检查（API，失败阻止发布）
        run: |
          python quality_platform/scripts/gate_check.py \
            --junit-xml reports/platform/junit-api.xml \
            --min-pass-rate 80 --max-fail 5

      - name: 上传 API 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: allure-results-api

      - name: 上传 API 测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: logs/

  # 生成 Allure 报告
  allure-report:
    name: 生成 Allure 报告
    needs: [platform-unit-tests, web-tests, api-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 版本
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载测试结果
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并测试结果
        run: |
          mkdir -p merged-allure-results
          cp -r artifacts/ui-test-results/* merged-allure-results/ 2>/dev/null || true
          cp -r artifacts/api-test-results/* merged-allure-results/ 2>/dev/null || true

      - name: 安装 Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install -g allure-commandline

      - name: 生成报告
        run: |
          if [ -d "merged-allure-results" ] && [ "$(ls -A merged-allure-results 2>/dev/null)" ]; then
            allure generate merged-allure-results -o allure-report --clean
          else
            echo "无测试结果，跳过报告生成"
            mkdir -p allure-report
          fi

      - name: 上传 Allure 报告
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: 发布 GitHub Pages 报告
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          allow_empty_commit: true
          keep_files: true
          force_orphan: true
