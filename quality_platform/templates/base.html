<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}质量工程平台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <span class="brand">质量工程平台</span>
    <a href="/" class="{{ 'active' if request.path == '/' }}">看板</a>
    <a href="/failures" class="{{ 'active' if request.path == '/failures' }}">失败分析</a>
    <a href="/runs" class="{{ 'active' if request.path == '/runs' }}">执行中心</a>
    <a href="/cases" class="{{ 'active' if request.path == '/cases' }}">用例</a>
    <span style="flex:1"></span>
    <span id="nav-user" class="hint"></span>
    <a href="#" id="btn-logout" style="display:none">登出</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
