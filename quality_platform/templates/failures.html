{% extends "base.html" %}
{% block title %}失败分析 · 质量工程平台{% endblock %}
{% block content %}
<h1>失败分析 <span class="hint">失败即证据 + 指纹聚类（同根因 N 个失败）</span></h1>
<div class="toolbar">
  <button id="btn-flaky" class="btn">检测 flaky 用例</button>
  <span id="flaky-result" class="hint"></span>
</div>

<h2>失败指纹聚类（根因视图）</h2>
<table class="tbl">
  <thead><tr><th>根因簇</th><th>错误类型</th><th>指纹</th><th>影响用例</th><th>代表用例</th></tr></thead>
  <tbody id="clusters-tbody"></tbody>
</table>

<h2>失败用例明细</h2>
<table class="tbl">
  <thead>
    <tr><th>用例</th><th>错误类型</th><th>错误信息</th><th>截图</th><th>AI 归因</th><th>操作</th></tr>
  </thead>
  <tbody id="failures-tbody"></tbody>
</table>
{% endblock %}
