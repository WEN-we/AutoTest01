# 质量工程平台配置
# 对标大厂（字节/腾讯）质量门禁与度量参数

# 质量门禁（Quality Gate）：最近一次完成的执行按此规则判定
gate:
  enabled: true
  min_pass_rate: 80.0        # 通过率低于此值 → FAIL（门禁不过）
  warn_pass_rate: 90.0       # 通过率低于此值 → WARN
  max_fail_count: 5          # 失败用例数超过此值 → FAIL
  max_flaky_rate: 0.3        # flaky 用例占比超过此值 → WARN

# 质量分权重（综合评分 0~100）
quality_score:
  pass_rate_weight: 0.6      # 通过率权重
  stability_weight: 0.3      # 稳定性权重（flaky 越少越高）
  coverage_weight: 0.1       # 执行覆盖率权重（已执行用例数占比）

# 执行环境变量（注入 pytest 子进程，覆盖被测服务地址；大厂"执行配置"）
# ${VAR} 透传宿主环境变量：如 ${LOCAL_DB_PASSWORD} 从 .env 读取（gitignore，密码不入库）
exec_env:
  TEST_API_URL: "http://127.0.0.1:8090"
  TEST_UI_URL: "http://127.0.0.1:8090"
  HEADLESS: "true"
  LOCAL_DB_HOST: "127.0.0.1"
  LOCAL_DB_PORT: "3306"
  LOCAL_DB_USER: "${LOCAL_DB_USER}"
  LOCAL_DB_PASSWORD: "${LOCAL_DB_PASSWORD}"
  LOCAL_DB_NAME: "${LOCAL_DB_NAME}"

# 结果通知（大厂：失败自动告警；钉钉/企微/通用 webhook）
# webhook_url 支持 ${ENV_VAR} 从环境变量读取，如 ${DINGTALK_WEBHOOK}
notify:
  enabled: true
  webhook_url: ""            # 留空则关闭通知

# 失败自动归因（智能闭环：执行完成 → 失败用例自动 AI 归因 → 通知带结论）
# - enabled: 关闭后失败页需人工点"AI 归因"按钮
# - max_cases: 单次执行最多自动归因的失败条数（控制 LLM 调用成本）
# - LLM 未配置时自动降级为规则引擎归因（关键词分类）
auto_analysis:
  enabled: true
  max_cases: 10
